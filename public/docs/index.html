<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthOS API</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui.css" integrity="sha384-h0W3Vqg5Snxbn56nHu/JCHYsKdSuoEcQneezEWEYGsAdajQJkgD+v9Qy8cuv/1bA" crossorigin="anonymous" />
    <link rel="icon" href="../favicon.ico" />
    <style>
        body {
            margin: 0;
            background: #fff;
        }

        .swagger-ui .information-container .info {
            margin: 32px 0 16px;
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui-bundle.js" integrity="sha384-jVJWQ0wtFEKcwLYTTe3ZTkA8DbVK3s5bLmxjc30v16evmnx8m4NYVsc52bA+qIUl" crossorigin="anonymous" charset="UTF-8"></script>
    <script>
        window.ui = SwaggerUIBundle({
            url: 'openapi.yaml',
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [SwaggerUIBundle.presets.apis],
            layout: 'BaseLayout',
            docExpansion: 'none',
            defaultModelsExpandDepth: -1,
            filter: true,
            tryItOutEnabled: true,
        });
    </script>
</body>
</html>
