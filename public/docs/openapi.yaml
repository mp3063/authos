components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Passport access token from login, registration or the OAuth token endpoint.'
    oauth2:
      type: oauth2
      description: 'Passport authorization server. Authorization code requires PKCE for public clients (S256 or plain).'
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            '*': 'Full access'
            openid: 'OpenID Connect access'
            profile: 'Access user profile information'
            email: 'Access user email address'
            read: 'Read access to your account'
            write: 'Write access to your account'
            users.read: 'Read user information'
            users.write: 'Write user information'
            users.update: 'Update user information'
            users.delete: 'Delete users'
            users.manage: 'Manage users'
            applications.read: 'Read application information'
            applications.write: 'Write application information'
            applications.update: 'Update applications'
            applications.delete: 'Delete applications'
            applications.manage: 'Manage applications'
            organizations.read: 'Read organization information'
            organizations.write: 'Write organization information'
            organizations.update: 'Update organizations'
            organizations.manage: 'Manage organizations'
            sso: 'Single Sign-On access'
            roles.assign: 'Assign roles to users'
            mfa.setup: 'Set up multi-factor authentication'
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            '*': 'Full access'
            openid: 'OpenID Connect access'
            profile: 'Access user profile information'
            email: 'Access user email address'
            read: 'Read access to your account'
            write: 'Write access to your account'
            users.read: 'Read user information'
            users.write: 'Write user information'
            users.update: 'Update user information'
            users.delete: 'Delete users'
            users.manage: 'Manage users'
            applications.read: 'Read application information'
            applications.write: 'Write application information'
            applications.update: 'Update applications'
            applications.delete: 'Delete applications'
            applications.manage: 'Manage applications'
            organizations.read: 'Read organization information'
            organizations.write: 'Write organization information'
            organizations.update: 'Update organizations'
            organizations.manage: 'Manage organizations'
            sso: 'Single Sign-On access'
            roles.assign: 'Assign roles to users'
            mfa.setup: 'Set up multi-factor authentication'
        password:
          tokenUrl: /oauth/token
          scopes:
            '*': 'Full access'
            openid: 'OpenID Connect access'
            profile: 'Access user profile information'
            email: 'Access user email address'
            read: 'Read access to your account'
            write: 'Write access to your account'
            users.read: 'Read user information'
            users.write: 'Write user information'
            users.update: 'Update user information'
            users.delete: 'Delete users'
            users.manage: 'Manage users'
            applications.read: 'Read application information'
            applications.write: 'Write application information'
            applications.update: 'Update applications'
            applications.delete: 'Delete applications'
            applications.manage: 'Manage applications'
            organizations.read: 'Read organization information'
            organizations.write: 'Write organization information'
            organizations.update: 'Update organizations'
            organizations.manage: 'Manage organizations'
            sso: 'Single Sign-On access'
            roles.assign: 'Assign roles to users'
            mfa.setup: 'Set up multi-factor authentication'
  responses:
    Success:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    Created:
      description: Created
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    Paginated:
      description: 'Paginated list'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedResponse'
    MfaRequired:
      description: 'The user has MFA enabled; complete the challenge at `POST /api/v1/auth/mfa/verify`'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MfaChallenge'
    MfaSetupRequired:
      description: 'The organization requires MFA and the user has none set up (or, for an authenticated call, the caller lacks permission)'
      content:
        application/json:
          schema:
            oneOf:
              -
                $ref: '#/components/schemas/MfaSetupRequired'
              -
                $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: 'Missing, invalid or expired access token'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: authentication_required
              message: Unauthenticated.
            message: Unauthenticated.
    Forbidden:
      description: "The caller lacks permission, or the record is outside the caller's organization; unknown IDs get the same answer"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: insufficient_permissions
              message: 'Insufficient permissions'
            message: 'Insufficient permissions'
    NotFound:
      description: 'Not found (only after authorization passes)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: resource_not_found
              message: 'Resource not found'
            message: 'Resource not found'
    ValidationFailed:
      description: 'Validation failed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: 'Rate limit exceeded'
      headers:
        Retry-After:
          description: 'Seconds until the limit resets'
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: rate_limit_exceeded
              message: 'Too many requests'
            message: 'Too many requests'
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'John Doe'
        email:
          type: string
          format: email
          example: john@example.com
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        avatar:
          type: string
          format: uri
          nullable: true
          description: "URL to user's avatar image"
        profile:
          type: object
          nullable: true
          example:
            timezone: America/New_York
            language: en
        organization_id:
          type: integer
          nullable: true
          example: 1
        organization:
          $ref: '#/components/schemas/Organization'
        mfa_enabled:
          type: boolean
          example: false
        is_active:
          type: boolean
          example: true
        roles:
          type: array
          items:
            type: string
          example:
            - user
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        avatar:
          type: string
          format: uri
          nullable: true
        profile:
          type: object
        organization:
          $ref: '#/components/schemas/Organization'
        mfa_enabled:
          type: boolean
        preferences:
          type: object
          properties:
            notifications:
              type: object
              properties:
                email:
                  type: boolean
                push:
                  type: boolean
            theme:
              type: string
              enum:
                - light
                - dark
                - auto
    UserInfo:
      type: object
      description: 'OpenID Connect UserInfo response (scope-dependent)'
      properties:
        sub:
          type: string
          description: 'Subject identifier (user ID)'
          example: '1'
        name:
          type: string
          description: 'Full name (profile scope)'
          example: 'John Doe'
        email:
          type: string
          format: email
          description: 'Email address (email scope)'
          example: john@example.com
        email_verified:
          type: boolean
          description: 'Email verification status (email scope)'
          example: true
        profile:
          type: object
          description: 'Profile information (profile scope)'
        picture:
          type: string
          format: uri
          description: 'Avatar URL (profile scope)'
        updated_at:
          type: integer
          description: 'Last updated timestamp'
    Organization:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'TechCorp Solutions'
        slug:
          type: string
          example: techcorp-solutions
        settings:
          type: object
          example:
            require_mfa: false
            session_timeout: 1440
        is_active:
          type: boolean
          example: true
        applications_count:
          type: integer
          description: 'Number of applications in organization'
        users_count:
          type: integer
          description: 'Number of users with access to organization applications'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Application:
      type: object
      properties:
        id:
          type: integer
          example: 1
        organization_id:
          type: integer
          example: 1
        organization:
          $ref: '#/components/schemas/Organization'
        name:
          type: string
          example: 'My Application'
        client_id:
          type: string
          example: 9c2b8a1e-4f5d-4a7b-8c9d-1e2f3g4h5i6j
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
          example:
            - 'https://app.example.com/callback'
        allowed_origins:
          type: array
          items:
            type: string
          example:
            - 'https://app.example.com'
        allowed_grant_types:
          type: array
          items:
            type: string
          example:
            - authorization_code
        webhook_url:
          type: string
          format: uri
          nullable: true
        settings:
          type: object
          nullable: true
        is_active:
          type: boolean
          example: true
        users_count:
          type: integer
          description: 'Number of users with access to this application'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ApplicationDetail:
      allOf:
        -
          $ref: '#/components/schemas/Application'
        -
          type: object
          properties:
            client_secret:
              type: string
              description: 'Client secret (only shown in detail view)'
              example: abc123def456...
            users:
              type: array
              items:
                $ref: '#/components/schemas/ApplicationAccess'
    ApplicationAccess:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/Application'
        user:
          $ref: '#/components/schemas/User'
        metadata:
          type: object
          nullable: true
          description: 'Additional metadata for the access grant'
        last_login_at:
          type: string
          format: date-time
          nullable: true
        login_count:
          type: integer
          example: 5
        granted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaginatedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items: []
        meta:
          type: object
          properties:
            pagination:
              type: object
              properties:
                current_page:
                  type: integer
                last_page:
                  type: integer
                per_page:
                  type: integer
                total:
                  type: integer
                from:
                  type: integer
                  nullable: true
                to:
                  type: integer
                  nullable: true
        links:
          type: object
          properties:
            first:
              type: string
              format: uri
            last:
              type: string
              format: uri
            prev:
              type: string
              format: uri
              nullable: true
            next:
              type: string
              format: uri
              nullable: true
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        message:
          type: string
    ValidationError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: validation_failed
        error_description:
          type: string
          example: 'The given data was invalid.'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - 'The email field is required.'
    Invitation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: newuser@example.com
        organization_id:
          type: integer
          example: 1
        organization:
          $ref: '#/components/schemas/Organization'
        role:
          type: string
          example: user
        status:
          type: string
          enum:
            - pending
            - accepted
            - expired
          example: pending
        token:
          type: string
          example: abc123def456
        invited_by:
          $ref: '#/components/schemas/User'
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
          nullable: true
        application_ids:
          type: array
          items:
            type: integer
          example:
            - 1
            - 2
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CustomRole:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: application_manager
        display_name:
          type: string
          example: 'Application Manager'
        description:
          type: string
          example: 'Manages organization applications'
        organization_id:
          type: integer
          example: 1
        permissions:
          type: array
          items:
            type: string
          example:
            - applications.read
            - applications.write
        users_count:
          type: integer
          description: 'Number of users with this role'
          example: 5
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          description: 'The resource, list or result'
        message:
          type: string
    MfaChallenge:
      type: object
      properties:
        message:
          type: string
          example: 'Multi-factor authentication is required'
        mfa_required:
          type: boolean
          example: true
        challenge_token:
          type: string
        available_methods:
          type: array
          items:
            type: string
          example:
            - totp
    MfaSetupRequired:
      type: object
      properties:
        message:
          type: string
          example: 'Your organization requires multi-factor authentication. Set it up to continue.'
        error:
          type: string
          example: mfa_setup_required
        setup_token:
          type: string
          description: 'Access token with only the `mfa.setup` scope'
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
    TokenUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        organization_id:
          type: integer
          nullable: true
    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/TokenUser'
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          nullable: true
          description: 'Not issued by this endpoint; use the OAuth token endpoint for refresh tokens'
        scopes:
          type: string
          example: 'openid profile email'
    RegisterResponse:
      type: object
      properties:
        user:
          allOf:
            -
              $ref: '#/components/schemas/TokenUser'
            -
              type: object
              properties:
                profile:
                  type: object
                is_active:
                  type: boolean
                email_verified_at:
                  type: string
                  format: date-time
                  nullable: true
                mfa_enabled:
                  type: boolean
                created_at:
                  type: string
                  format: date-time
        token:
          type: object
          properties:
            access_token:
              type: string
            token_type:
              type: string
              example: Bearer
            expires_at:
              type: string
              format: date-time
        scopes:
          type: string
          example: 'openid profile email'
    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            type: string
    OAuthTokenResponse:
      type: object
      properties:
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        access_token:
          type: string
        refresh_token:
          type: string
          description: 'Issued for authorization code, password and refresh token grants'
    OAuthError:
      type: object
      properties:
        error:
          type: string
          example: invalid_grant
        error_description:
          type: string
        message:
          type: string
tags:
  -
    name: Authentication
    description: 'Registration, login, logout, token refresh/revocation and password reset'
  -
    name: 'Social Authentication'
    description: 'Sign-in through Google, GitHub, Facebook, Twitter and LinkedIn'
  -
    name: MFA
    description: 'TOTP setup, verification, recovery codes and MFA challenges'
  -
    name: 'OAuth 2.0 / OpenID Connect'
    description: 'Passport authorization server, OIDC discovery, JWKS and UserInfo'
  -
    name: Users
    description: 'User management, roles, sessions and application access'
  -
    name: Applications
    description: 'OAuth clients, credentials, tokens and analytics'
  -
    name: Organizations
    description: 'Organizations, settings, users, applications, custom roles, invitations, reports and metrics'
  -
    name: Invitations
    description: 'Accepting invitations and bulk invitation actions'
  -
    name: Profile
    description: "The current user's profile, avatar, preferences, security, social accounts and privacy consents"
  -
    name: SSO
    description: 'OIDC and SAML 2.0 single sign-on, SSO sessions, configurations and SAML certificates'
  -
    name: Enterprise
    description: 'LDAP, branding, custom domains, audit exports and compliance reports'
  -
    name: Webhooks
    description: 'Webhook subscriptions, event types and deliveries'
  -
    name: 'Bulk Operations'
    description: 'Bulk user import/export and migrations'
  -
    name: Monitoring
    description: 'Health checks, metrics and error tracking'
  -
    name: Cache
    description: 'Cache statistics and clearing (super admin)'
  -
    name: Configuration
    description: 'Global configuration'
  -
    name: System
    description: 'API version information'
