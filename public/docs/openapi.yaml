  /api/v1/users:
    get:
      tags:
        - Users
      summary: 'List users'
      description: |-
        Get paginated list of users with filtering and search capabilities

        Rate limit: 60 requests per minute per user (per IP when unauthenticated).
      operationId: userIndex
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: mfa_enabled
          in: query
          schema:
            type: boolean
        -
          name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
        -
          name: organization_id
          in: query
          schema:
            type: integer
          description: 'Must exist in organizations'
        -
          name: page
          in: query
          schema:
            type: integer
            minimum: 1
        -
          name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        -
          name: role
          in: query
          schema:
            type: string
        -
          name: search
          in: query
          schema:
            type: string
            maxLength: 255
        -
          name: sort
          in: query
          schema:
            type: string
            maxLength: 50
      responses:
        200:
          description: 'Users retrieved successfully'
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/PaginatedResponse'
                  -
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Users
      summary: 'Create user'
      description: |-
        Create a new user account

        Rate limit: 60 requests per minute per user (per IP when unauthenticated).
      operationId: userStore
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  description: 'Must be unique in users'
                name:
                  type: string
                  maxLength: 255
                organization_id:
                  type: integer
                  description: 'Must exist in organizations'
                password:
                  type: string
                  description: 'Must satisfy the password policy'
                profile:
                  type: object
                  properties:
                    department:
                      type: string
                      maxLength: 100
                    job_title:
                      type: string
                      maxLength: 100
                    language:
                      type: string
                      enum:
                        - en
                        - es
                        - fr
                        - de
                        - it
                        - pt
                        - nl
                        - ru
                        - ja
                        - zh
                    theme:
                      type: string
                      enum:
                        - light
                        - dark
                        - auto
                    timezone:
                      type: string
                      description: 'IANA timezone'
                roles:
                  type: array
                  items:
                    type: string
                    description: 'Must exist in roles'
                  description: 'Array of role names to assign'
              required:
                - email
                - name
                - organization_id
                - password
      responses:
        201:
          description: 'User created'
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/SuccessResponse'
                  -
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          email:
                            type: string
                          email_verified_at:
                            type: string
                            format: date-time
                            nullable: true
                          profile:
                            type: object
                          mfa_enabled:
                            type: boolean
                          mfa_methods:
                            type: array
                            items:
                              type: string
                          is_active:
                            type: boolean
                          organization_id:
                            type: integer
                            nullable: true
                          organization:
                            type: object
                            nullable: true
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              slug:
                                type: string
                          roles:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                                display_name:
                                  type: string
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/TooManyRequests'
