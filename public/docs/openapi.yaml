openapi: 3.0.3
info:
  title: 'AuthOS API'
  version: 1.0.0
  description: |
    AuthOS is an authentication service built with Laravel 13 and Passport 13: an OAuth 2.0 authorization server
    with PKCE, OpenID Connect, SAML 2.0, MFA, social login, LDAP and multi-tenant organizations.

    Request bodies and query parameters are taken from the validation rules in the code.

    ## Authentication
    Send an access token as `Authorization: Bearer {access_token}`. Tokens come from `POST /api/v1/auth/login`,
    `POST /api/v1/auth/register` or the OAuth endpoints (`/oauth/authorize` and `/oauth/token`).

    ## Multi-factor authentication
    Sign-in endpoints answer a user who has MFA enabled with **202** `mfa_required` and a `challenge_token`;
    finish with `POST /api/v1/auth/mfa/verify`. A member of an organization that requires MFA who has none set up
    gets **403** `mfa_setup_required` with a `setup_token` (scope `mfa.setup`, 15 minutes). That token only works
    on the MFA setup endpoints and logout; anywhere else it gets 403 `mfa_setup_required`.

    ## Organization scoping
    Users only see their own organization's data; super admins are unscoped. Lookups authorize before revealing
    whether a record exists: a caller without the ability gets **403** for unknown and foreign IDs alike, and
    **404** only after authorization passes.

    ## Responses
    Successful responses use `{ "success": true, "data": ..., "message": ... }`; lists add `meta` and `links`
    pagination. Errors use `{ "success": false, "error": { "code", "message" }, "message" }`, and validation
    errors use `{ "success": false, "error": "validation_failed", "error_description", "errors" }`. Error
    responses never include exception text.

    ## Rate limits
    - `api`: 60 requests per minute per user (per IP when unauthenticated)
    - `auth`: 10 requests per minute per IP
    - `oauth`: 20 requests per minute per IP
    - Some endpoints set their own limit; it is listed in the endpoint's description.
  license:
    name: 'MIT License'
    url: 'https://opensource.org/licenses/MIT'
servers:
  -
    url: 'http://authos.test'
    description: 'Local development (Laravel Herd)'
  -
    url: '{scheme}://{host}'
    description: 'Custom host'
    variables:
      scheme:
        default: http
        enum:
          - http
          - https
      host:
        default: authos.test
security:
  -
    bearerAuth: []
paths:
  /oauth/authorize:
    get:
      tags:
        - 'OAuth 2.0 / OpenID Connect'
      summary: 'Authorization endpoint'
      description: |
        Starts the authorization code flow (RFC 6749) in the browser. The user signs in through the web session and
        approves the client. Public clients must send a PKCE `code_challenge` (S256 or plain).
        A signed-in user who must set up MFA is redirected to the admin panel's MFA setup page first.
      operationId: oauthAuthorize
      security: []
      parameters:
        -
          name: response_type
          in: query
          required: true
          schema:
            type: string
            enum:
              - code
        -
          name: client_id
          in: query
          required: true
          schema:
            type: string
        -
          name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        -
          name: scope
          in: query
          schema:
            type: string
          description: 'Space-separated scopes'
          example: 'openid profile email'
        -
          name: state
          in: query
          schema:
            type: string
        -
          name: code_challenge
          in: query
          schema:
            type: string
        -
          name: code_challenge_method
          in: query
          schema:
            type: string
            enum:
              - S256
              - plain
        -
          name: prompt
          in: query
          schema:
            type: string
            enum:
              - none
              - consent
              - login
      responses:
        200:
          description: 'Consent screen (HTML)'
        302:
          description: 'Redirect to the login page, to the client with `code` and `state`, or to MFA setup'
    post:
      tags:
        - 'OAuth 2.0 / OpenID Connect'
      summary: 'Approve the authorization request'
      description: 'Submitted by the consent screen; requires the web session.'
      operationId: oauthApproveAuthorization
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - state
                - client_id
                - auth_token
              properties:
                state:
                  type: string
                client_id:
                  type: string
                auth_token:
                  type: string
      responses:
        302:
          description: 'Redirect to the client with an authorization `code`'
    delete:
      tags:
        - 'OAuth 2.0 / OpenID Connect'
      summary: 'Deny the authorization request'
      description: 'Submitted by the consent screen; requires the web session.'
      operationId: oauthDenyAuthorization
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - state
                - client_id
                - auth_token
              properties:
                state:
                  type: string
                client_id:
                  type: string
                auth_token:
                  type: string
      responses:
        302:
          description: 'Redirect to the client with `error=access_denied`'
  /oauth/token:
    post:
      tags:
        - 'OAuth 2.0 / OpenID Connect'
      summary: 'Token endpoint'
      description: |
        Issues tokens for the `authorization_code` (with PKCE `code_verifier`), `client_credentials`, `password` and
        `refresh_token` grants. Refresh tokens rotate. The password grant refuses users who require MFA.

        Rate limit: 60 requests per minute.
      operationId: oauthToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - client_credentials
                    - password
                    - refresh_token
                client_id:
                  type: string
                client_secret:
                  type: string
                  description: 'Confidential clients only'
                code:
                  type: string
                  description: 'authorization_code grant'
                redirect_uri:
                  type: string
                  format: uri
                  description: 'authorization_code grant'
                code_verifier:
                  type: string
                  description: 'authorization_code grant with PKCE'
                username:
                  type: string
                  format: email
                  description: 'password grant'
                password:
                  type: string
                  description: 'password grant'
                refresh_token:
                  type: string
                  description: 'refresh_token grant'
                scope:
                  type: string
                  description: 'Space-separated scopes'
      responses:
        200:
          description: 'Tokens issued'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        400:
          description: 'Invalid request or grant'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        401:
          description: 'Client authentication failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        429:
          $ref: '#/components/responses/TooManyRequests'
  /oauth/token/refresh:
    post:
      tags:
        - 'OAuth 2.0 / OpenID Connect'
      summary: 'Refresh the transient token'
      description: "Refreshes Passport's transient API token cookie for the signed-in web session. Not used by OAuth clients."
      operationId: oauthRefreshTransientToken
      security: []
      responses:
        200:
          description: 'Transient token cookie refreshed'
  /api/.well-known/openid-configuration:
    get:
      tags:
        - 'OAuth 2.0 / OpenID Connect'
      summary: 'OpenID Connect Discovery endpoint'
      description: 'Get OpenID Connect server configuration'
      operationId: openIdDiscovery
      security: []
      responses:
        200:
          description: 'OpenID Connect configuration'
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer:
                    type: string
                    format: uri
                    example: 'http://authos.test'
                  authorization_endpoint:
                    type: string
                    format: uri
                    example: 'http://authos.test/oauth/authorize'
                  token_endpoint:
                    type: string
                    format: uri
                    example: 'http://authos.test/oauth/token'
                  userinfo_endpoint:
                    type: string
                    format: uri
                    example: 'http://authos.test/api/v1/oauth/userinfo'
                  jwks_uri:
                    type: string
                    format: uri
                    example: 'http://authos.test/api/v1/oauth/jwks'
                  response_types_supported:
                    type: array
                    items:
                      type: string
                    example:
                      - code
                      - token
                      - id_token
                  subject_types_supported:
                    type: array
                    items:
                      type: string
                    example:
                      - public
                  id_token_signing_alg_values_supported:
                    type: array
                    items:
                      type: string
                    example:
                      - RS256
                  scopes_supported:
                    type: array
                    items:
                      type: string
                    example:
                      - openid
                      - profile
                      - email
                      - read
                      - write
                  grant_types_supported:
                    type: array
                    items:
                      type: string
                    example:
                      - authorization_code
                      - implicit
                      - client_credentials
                      - password
  /api/health:
    get:
      tags:
        - Monitoring
      summary: 'Basic health check (liveness probe)'
      operationId: healthCheckIndex
      security: []
      responses:
        200:
          $ref: '#/components/responses/Success'
  /api/health/detailed:
    get:
      tags:
        - Monitoring
      summary: 'Detailed health check'
      description: 'Super admin only.'
      operationId: healthCheckDetailed
      security:
        -
          bearerAuth: []
      responses:
        200:
          $ref: '#/components/responses/Success'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
  /api/health/liveness:
    get:
      tags:
        - Monitoring
      summary: 'Kubernetes liveness probe'
      operationId: healthCheckLiveness
      security: []
      responses:
        200:
          $ref: '#/components/responses/Success'
  /api/health/readiness:
    get:
      tags:
        - Monitoring
      summary: 'Kubernetes readiness probe'
      operationId: healthCheckReadiness
      security: []
      responses:
        200:
          $ref: '#/components/responses/Success'
  '/api/health/{component}':
    get:
      tags:
        - Monitoring
      summary: 'Component-specific health check'
      description: 'Super admin only.'
      operationId: healthCheckComponent
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: component
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: '#/components/responses/Success'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
  /api/version:
    get:
      tags:
        - System
      summary: Version
      operationId: closureVersion
      security: []
      responses:
        200:
          $ref: '#/components/responses/Success'
  /api/v1/applications:
    get:
      tags:
        - Applications
      summary: 'List applications'
      description: |-
        Get paginated list of OAuth applications

        Rate limit: 60 requests per minute per user (per IP when unauthenticated).
      operationId: applicationIndex
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: is_active
          in: query
          schema:
            type: boolean
        -
          name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
        -
          name: organization_id
          in: query
          schema:
            type: integer
          description: 'Must exist in organizations'
        -
          name: page
          in: query
          schema:
            type: integer
            minimum: 1
        -
          name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        -
          name: search
          in: query
          schema:
            type: string
            maxLength: 255
        -
          name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - created_at
              - updated_at
      responses:
        200:
          description: 'Applications (custom pagination, no success flag)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        client_id:
                          type: string
                        redirect_uris:
                          type: array
                          items:
                            type: string
                        allowed_origins:
                          type: array
                          items:
                            type: string
                        allowed_grant_types:
                          type: array
                          items:
                            type: string
                        scopes:
                          type: array
                          items:
                            type: string
                        settings:
                          type: object
                        is_active:
                          type: boolean
                        organization_id:
                          type: integer
                        organization:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            slug:
                              type: string
                        user_count:
                          type: integer
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                          per_page:
                            type: integer
                          total:
                            type: integer
                          total_pages:
                            type: integer
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                      next:
                        type: string
                        nullable: true
                      prev:
                        type: string
                        nullable: true
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Applications
      summary: 'Create application'
      description: |-
        Create a new OAuth application

        Rate limit: 60 requests per minute per user (per IP when unauthenticated).
      operationId: applicationStore
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowed_grant_types:
                  type: array
                  items:
                    type: string
                    enum:
                      - authorization_code
                      - client_credentials
                      - refresh_token
                      - password
                allowed_origins:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: uri
                  example:
                    - 'https://app.example.com'
                description:
                  type: string
                  maxLength: 1000
                name:
                  type: string
                  maxLength: 255
                  example: 'My App'
                organization_id:
                  type: string
                  enum:
                    - $caller->organization_id
                redirect_uris:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: uri
                    maxLength: 2048
                  example:
                    - 'https://app.example.com/callback'
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - openid
                      - profile
                      - email
                      - read
                      - write
                      - admin
                settings:
                  type: object
                  properties:
                    auto_approve:
                      type: boolean
                    refresh_token_lifetime:
                      type: integer
                      minimum: 3600
                      maximum: 31536000
                    require_pkce:
                      type: boolean
                    token_lifetime:
                      type: integer
                      minimum: 300
                      maximum: 86400
              required:
                - allowed_grant_types
                - name
                - redirect_uris
      responses:
        201:
          description: 'Application created successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApplicationDetail'
                  message:
                    type: string
                    example: 'Application created successfully'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/v1/applications/{id}':
    get:
      tags:
        - Applications
      summary: 'Get application details'
      description: |-
        Retrieve detailed information about an application

        Rate limit: 60 requests per minute per user (per IP when unauthenticated).
      operationId: applicationShow
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Application details'
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/SuccessResponse'
                  -
                    type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          description:
                            type: string
                            nullable: true
                          client_id:
                            type: string
                          client_secret:
                            type: string
                            description: 'Only when the caller may update the application'
                          redirect_uris:
                            type: array
                            items:
                              type: string
                          allowed_origins:
                            type: array
                            items:
                              type: string
                          allowed_grant_types:
                            type: array
                            items:
                              type: string
                          scopes:
                            type: array
                            items:
                              type: string
                          settings:
                            type: object
                          is_active:
                            type: boolean
                          organization_id:
                            type: integer
                          organization:
                            type: object
                            nullable: true
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              slug:
                                type: string
                          user_count:
                            type: integer
                          users:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                                email:
                                  type: string
                                granted_at:
                                  type: string
                                  format: date-time
                                  nullable: true
                                last_login_at:
                                  type: string
                                  format: date-time
                                  nullable: true
                                login_count:
                                  type: integer
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Applications
      summary: 'Update application'
      description: |-
        Update application information

        Rate limit: 60 requests per minute per user (per IP when unauthenticated).
      operationId: applicationUpdate
      security:
        -
          bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                allowed_grant_types:
                  type: array
                  items:
                    type: string
                    enum:
                      - authorization_code
                      - client_credentials
                      - refresh_token
                      - password
                allowed_origins:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    format: uri
                description:
                  type: string
                  maxLength: 1000
                is_active:
                  type: boolean
                name:
                  type: string
                  maxLength: 255
                redirect_uris:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: uri
                    maxLength: 2048
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - openid
                      - profile
                      - email
                      - read
                      - write
                      - admin
                settings:
                  type: object
                  properties:
                    auto_approve:
                      type: boolean
                    refresh_token_lifetime:
                      type: integer
                      minimum: 3600
                      maximum: 31536000
                    require_pkce:
                      type: boolean
                    token_lifetime:
                      type: integer
                      minimum: 300
                      maximum: 86400
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Application updated successfully'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Application'
                  message:
                    type: string
                    example: 'Application updated successfully'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Applications
      summary: 'Delete application'
      description: |-
        Delete an OAuth application

        Rate limit: 60 requests per minute per user (per IP when unauthenticated).
      operationId: applicationDestroy
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'Application deleted (empty body)'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/v1/applications/{id}/analytics':
    get:
      tags:
        - Applications
      summary: 'Get application analytics'
      description: 'Rate limit: 60 requests per minute per user (per IP when unauthenticated).'
      operationId: applicationAnalytics
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
        -
          name: period
          in: query
          schema:
            type: string
            enum:
              - 24h
              - 7d
              - 30d
              - 90d
      responses:
        200:
          $ref: '#/components/responses/Success'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/v1/applications/{id}/credentials/regenerate':
    post:
      tags:
        - Applications
      summary: 'Regenerate application credentials'
      description: 'Rate limit: 60 requests per minute per user (per IP when unauthenticated).'
      operationId: applicationRegenerateCredentials
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          $ref: '#/components/responses/Success'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
  '/api/v1/applications/{id}/tokens':
    get:
      tags:
        - Applications
      summary: 'Get application active tokens'
      description: 'Rate limit: 60 requests per minute per user (per IP when unauthenticated).'
      operationId: applicationTokenTokens
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          $ref: '#/components/responses/Success'
        401:
          $ref: '#/components/responses/Unauthenticated'
        403:
          $ref: '#/components/responses/Forbidden'
        404:
          $ref: '#/components/responses/NotFound'
        429:
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Applications
      summary: 'Revoke all application tokens'
      description: 'Rate limit: 60 requests per minute per user (per IP when unauthenticated).'
      operationId: applicationTokenRevokeAllTokens
      security:
        -
          bearerAuth: []
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
