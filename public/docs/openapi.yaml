                  type: array
                  minItems: 1
                  items:
                    type: integer
                    description: 'Must exist in users'
                  example:
                    - 1
                    - 2
                    - 3
              required:
                - action
                - user_ids
      responses:
        200:
          description: 'Bulk operation completed'
          content:
            application/json:
              schema:
                allOf:
                  -
                    $ref: '#/components/schemas/SuccessResponse'
                  -
