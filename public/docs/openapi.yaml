  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: 'User login'
      description: |-
        Authenticate user and return access token

        Rate limit: 10 requests per minute per IP.

        A user who requires MFA gets 202 `mfa_required` with a `challenge_token` (complete it at `POST /api/v1/auth/mfa/verify`); a member of an organization that requires MFA who has none set up gets 403 `mfa_setup_required` with a setup-only `setup_token`.
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  example: 9c2b8a1e-4f5d-4a7b-8c9d-1e2f3g4h5i6j
                  description: 'OAuth client ID'
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  example: StrongP@ss123
                scopes:
                  type: array
                  items:
                    type: string
                    enum:
                      - openid
                      - profile
                      - email
                      - read
                      - write
                      - admin
                  example:
                    - openid
                    - profile
                    - email
                scope:
                  type: string
              required:
                - email
                - password
      responses:
        200:
          description: 'Signed in'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        202:
          $ref: '#/components/responses/MfaRequired'
        403:
          $ref: '#/components/responses/MfaSetupRequired'
        422:
          $ref: '#/components/responses/ValidationFailed'
        429:
          $ref: '#/components/responses/TooManyRequests'
